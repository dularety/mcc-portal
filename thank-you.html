<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Submitted</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="thankyou-page">
      <div class="thankyou-box" id="confirmationBox">
        <h1>Registration Submitted</h1>
        <p id="summaryText">Loading your submission details…</p>
        <div id="details"></div>
        <div style="margin-top:18px;">
          <a href="index.html" class="primary-btn">Return to Home</a>
        </div>
      </div>
    </main>

    <script>
      (function(){
        function get(k){ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }
        const roll = get('mcc_registration_roll');
        if(!roll){ document.getElementById('summaryText').textContent = 'No recent submission found.'; return; }
        const full = get('mcc_registration_full_name');
        const marks = get('mcc_registration_neet_marks');
        const rank = get('mcc_registration_neet_rank');
        const app = get('mcc_registration_application');
        const email = get('mcc_registration_email');
        const mobile = get('mcc_registration_mobile');
        const addr = get('mcc_registration_address');
        const docScore = get('mcc_doc_score');
        const docBirth = get('mcc_doc_birth');
        const docAdmit = get('mcc_doc_admit');
        const txn = get('mcc_payment_txn');
        const amount = get('mcc_payment_amount');
        const completed = get('mcc_registration_completed_at');
        const sms = get('mcc_sms_sent');
        const emailSent = get('mcc_email_sent');

        document.getElementById('summaryText').textContent = 'All details, documents and payment have been received. Your transaction ID is ' + (txn || 'N/A');

        const detailsDiv = document.getElementById('details');
        const created = completed ? new Date(completed).toLocaleString() : 'N/A';
        detailsDiv.innerHTML = `
          <dl>
            <dt>Application No</dt><dd>${app || '—'}</dd>
            <dt>NEET Roll</dt><dd>${roll}</dd>
            <dt>Name</dt><dd>${full || '—'}</dd>
            <dt>Marks / Rank</dt><dd>${marks || '—'} / ${rank || '—'}</dd>
            <dt>Email / Mobile</dt><dd>${email || '—'} / ${mobile || '—'}</dd>
            <dt>Address</dt><dd>${addr || '—'}</dd>
            <dt>Documents submitted</dt><dd>
              <ul>
                <li>Score Card: ${docScore ? docScore.name : 'Not uploaded'}</li>
                <li>Birth Certificate: ${docBirth ? docBirth.name : 'Not uploaded'}</li>
                <li>Admit Card: ${docAdmit ? docAdmit.name : 'Not uploaded'}</li>
              </ul>
            </dd>
            <dt>Payment</dt><dd>Amount: ₹${amount || '0.00'} — Transaction ID: ${txn || 'N/A'}</dd>
            <dt>SMS sent</dt><dd>${sms ? 'Yes — sent to ' + sms.to + ' at ' + new Date(sms.sentAt).toLocaleString() + '<br/><code>' + sms.text + '</code>' : 'No'}</dd>
            <dt>Email sent</dt><dd>${emailSent ? 'Yes — sent to ' + emailSent.to + ' at ' + new Date(emailSent.sentAt).toLocaleString() + '<br/><code>' + (emailSent.subject || '') + '</code><pre>' + (emailSent.body || '') + '</pre>' : 'No'}</dd>
            <dt>Submitted At</dt><dd>${created}</dd>
          </dl>
        `;
      })();
    </script>
  </body>
</html>
