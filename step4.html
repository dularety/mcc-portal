<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Step 4 — Payment</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="gov-header">
    <div class="gov-left">
      <div class="logo-mark">MCC</div>
      <div class="gov-title"><div class="org">Medical Counselling Committee (MCC), DGHS</div></div>
    </div>
  </header>

  <main class="registration-page">
    <div class="registration-shell">
      <div class="page-heading">
        <h1>Step 4 — Payment</h1>
        <p>Pay the registration fee of Rs 1000. Use the QR code below (demo).</p>
      </div>

      <div class="payment-card form-card">
        <div class="qr-wrap">
          <img id="paymentQr" alt="Payment QR code" src="" />
        </div>

        <div class="registration-actions">
          <a href="step3.html" class="secondary-btn">Back</a>
          <button id="confirmPayment" class="primary-btn">I have paid</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function(){
      const roll = JSON.parse(localStorage.getItem('mcc_registration_roll')||'null') || '';
      const amount = '1000.00';
      const paymentPayload = 'MCC|PAY|AMOUNT=' + amount + '|ROLL=' + roll + '|DATE=' + new Date().toISOString();
      const qrUrl = 'https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=' + encodeURIComponent(paymentPayload);
      document.getElementById('paymentQr').src = qrUrl;

      document.getElementById('confirmPayment').addEventListener('click', function(){
        const txn = 'TXN' + Math.floor(100000 + Math.random()*900000);
        localStorage.setItem('mcc_payment_txn', JSON.stringify(txn));
        localStorage.setItem('mcc_payment_amount', JSON.stringify(amount));
        localStorage.setItem('mcc_registration_completed_at', JSON.stringify(new Date().toISOString()));

        const sms = { to: '7979709641', text: 'Payment received. Transaction ID: ' + txn + '. Amount: INR ' + amount, sentAt: new Date().toISOString() };
        localStorage.setItem('mcc_sms_sent', JSON.stringify(sms));

        const email = { to: 'annipriyarolln@gmail.com', subject: 'MCC Registration Confirmation', body: 'Dear ' + (JSON.parse(localStorage.getItem('mcc_registration_full_name')||'""') ) + ',\n\nWe have received your payment. Transaction ID: ' + txn + '.\n\nRegards, MCC', sentAt: new Date().toISOString() };
        localStorage.setItem('mcc_email_sent', JSON.stringify(email));

        window.location.href = 'thank-you.html';
      });
    })();
  </script>

  <script src="script.js"></script>
</body>
</html>
